        <script>
            var iterations = 0;

            function docatmap() {
                var canvas = document.getElementById("myCanvas");

                var h = canvas.height;
                var w = canvas.width;
                var ctx = canvas.getContext('2d');
                var imageData = ctx.getImageData(0, 0, w, h);
                var data = imageData.data;

                var rim = ctx.createImageData(w, h);
                var result = rim.data;

                for (var y = 0; y < h; ++y)
                for (var x = 0; x < w; ++x)
                {
                    var xx = (x+y)%w;
                    var yy = (x+2*y)%h;

                    var ii = (yy * w + xx) * 4;
                    var r = data[ii];
                    var g = data[++ii];
                    var b = data[++ii];
                    var a = data[++ii];

                    yy = (yy + 1)%h;
                    ii = (yy * w + xx) * 4;
                    r += data[ii];
                    g += data[++ii];
                    b += data[++ii];
                    a += data[++ii];

                    xx = (xx + 1)%w;
                    ii = (yy * w + xx) * 4;
                    r += data[ii];
                    g += data[++ii];
                    b += data[++ii];
                    a += data[++ii];

                    yy = (yy + 1)%h;
                    ii = (yy * w + xx) * 4;
                    r += data[ii];
                    g += data[++ii];
                    b += data[++ii];
                    a += data[++ii];


                    var i = (y * w + x) * 4;
                    result[i]   = r >> 2;  // red
                    result[++i] = g >> 2;  // green
                    result[++i] = b >> 2;  // blue
                    result[++i] = a >> 2;
                }
                ctx.putImageData(rim, 0, 0);

                ++iterations;
                var counter = document.getElementById("iters");
                counter.innerHTML = iterations.toString();
            }
        </script>
    </head><body>

  <div id="title"><h1 class="banner">Cat Map</h1></div>
<div id="below">
</div>

<div id="main">
        <img id="image" src="catmap_files/happycat.gif" alt="Gandalf the Cat" width="500" height="500" style="display: none">
        <h2>Click on image to apply cat map.</h2>
        <p>Iterations = <span id="iters">0</span>.</p>
        <canvas id="myCanvas" width="500" height="500" style="border:1px solid
        #d3d3d3;">
        Your browser does not support the HTML5 canvas tag.</canvas>

        <script>

            var img=document.getElementById("image");
            img.onload = function() {
                var img=document.getElementById("image");
                var c=document.getElementById("myCanvas");
                var ctx=c.getContext("2d");
                ctx.drawImage(img,0,0);
            }

            var c=document.getElementById("myCanvas");
            c.onmouseup = docatmap; 

        </script>
